  # The following were commented out as part of the auto-mode data collection process.
  # When TOO-28 is implemented (specifically per-rule overrides) then these will be coinfigured for
  # auto-mode-specific behavior. So we will also need to modify some user level rules (like HEREDOC rules)
  #"Bash(python3 -m json.tool)",
  #"Bash(uv run *)",

  # TOO-19 note (2026-07-25), for whoever reads this next -- do NOT try to fix
  # the heredoc/`python -c` prompting by adding an allow rule here or anywhere
  # else in the hierarchy. It cannot work, by design:
  #
  #   command_extractor.py  flags foreign inline code / foreign heredoc sinks
  #                         with LeafCommand(ask_floor=True)
  #   compound.py:65-71     clamps the verdict -- an explicit `deny` is honoured,
  #                         but `allow` is UNCONDITIONALLY downgraded to `ask`
  #
  # There is no config knob gating that clamp (making it configurable is the
  # deferred ticket). The working alternative is to never inline Python into
  # bash at all: Write the script to a file, then run `uv run python <file>` --
  # a plain leaf command, allowed. That also matches the project's own
  # "no Bash for file operations" rule.
  #
  # TESTED 2026-07-25 -- adding an allow that matches the sentinel form
  # (`__HEREDOC_TO_python__`) does NOT help, and neither does `Bash(*)`.
  # Measured two ways in a throwaway dir:
  #   (a) end-to-end with an allow list containing every spelling of the
  #       sentinel form PLUS `Bash(*)`  -> still `ask`;
  #   (b) _resolve_leaf() called with a resolve_one stub that allows
  #       EVERYTHING (stronger than any writable rule) -> still `ask`.
  # Because compound.py resolves the outer command and then THROWS THE ALLOW
  # AWAY: only a `deny` returns early, every other verdict falls through to
  # the unconditional `return "ask", ...`. The rule does match; the match is
  # discarded. So this is not fixable from config at any pattern.
  #
  # Scope note: only FOREIGN executors get the floor (python/node/perl/ruby/
  # php/Rscript/awk/... -- see FOREIGN_EXECUTORS). A heredoc into bash/sh is
  # NOT ask-floored -- verified allowed. So there is no __HEREDOC_TO_bash__
  # problem to solve.
]

deny = [
  "Bash(python3 *)",  # You should always run python through uv in the current venv
  "Bash(python *)",  # You should always run python through uv in the current venv

  # <TEMPORARY>
  # TOO-45 refactoring-loop guards -- invariant 6, written as rules rather than as
  # prose in a prompt, because prose "MUST" language has a demonstrated track record
  # of being dropped in this setup.
  #
  # These are DENIES rather than omissions on purpose: with
  # no_match_fallback = "allow_with_no_warnings" above, a path that simply is not
  # allowed falls through to the fallback and is silently permitted. Only an
  # explicit deny stops anything while that fallback stands.
  #
  # Scope note: this closes the FILE-TOOL half only. Bash-side writes to the same
  # paths (`>`, `tee`, `rm`, `mv`) cannot be enumerated exhaustively by patterns;
  # those are covered after the fact by architecture_fitness.py --guard, which
  # inspects what was actually touched rather than predicting every spelling.
  #
  # Self-locking by design: once toolguard_hook.toml itself is denied, an agent
  # cannot remove this fence either, and a deny is only overridable at a MORE
  # specific level. Removal at ticket close is Arnon's action, via the IDE.
  #
  # Revert = delete this whole fence.

  # The decision log is evidence. The loop reads it; it never writes it.
  "Write(./logs/**)",
  "Edit(./logs/**)",

