# toolguard's own project config.
#
# Fallbacks are set explicitly rather than inherited from ~/.claude, even though
# the user level already says "ask". This is the repo where config behaviour is
# tested; its decisions should not shift because the user-level file was edited.
# The auto-mode handoff IS inherited: no_match_fallback_in_auto_mode and
# undecidable_fallback_in_auto_mode live at user level and apply here, so an
# unattended run proceeds while an interactive one prompts.
#
# Rules are in toolguard's own canonical order -- Bash, Read, Write, Edit, then
# lowercased pattern -- so `toolguard-maintain` will not reshuffle them.
no_match_fallback = "ask"
undecidable_fallback = "ask"

# A native allow rule cannot cover a command carrying a disclosure marker.
# `allow` deliberately does not match past an assignment of an unrecognised
# variable (see docs/auto-mode.md#auto_mode_behavior-and-command-prefixes), so
# `TG_INTENT=1 pbcopy` matches nothing here and prompts. That is working as
# intended: TG_ATTEST_READONLY=1 gets a blanket allow from a user-level regex
# because it attests the command is read-only, while TG_INTENT=1 only attests
# that a disclosure was written, which is not a safety claim. If a rule ever
# genuinely needs to pre-approve a disclosed, non-read-only command, it has to
# be a [regex] -- no native pattern can express it.
[permissions]
allow = [
  # toolguard does not strip `timeout` the way native does, so `pyright *`
  # cannot match a wrapped call and this second form is load-bearing.
  "Bash([regex]^timeout [0-9]* pyright .*)",
  # Both spellings, deliberately. `obsidian` stopped being a shell alias on
  # 2026-09-08 (the GUI launcher is `ob` now), so the bare form is correct going
  # forward; the escaped form is kept because the older `\obsidian` convention is
  # still in circulation and a backslash before a non-alias is harmless. Drop the
  # escaped line once nothing types it. A doubly-escaped pattern matches neither
  # -- that spelling was inert in the previous config.
  "Bash(\\obsidian *)",
  "Bash(ag *)",
  "Bash(basic-memory *)",
  "Bash(canopy *)",
  "Bash(git check-ignore *)",
  "Bash(git worktree *)",
  "Bash(grep *)",
  "Bash(npx canopy *)",
  "Bash(npx canopy@latest *)",
  "Bash(obsidian *)",
  "Bash(pbcopy)",
  "Bash(pyright *)",
  "Bash(pyscn analyze *)",
  "Bash(rtk grep *)",
  "Bash(rtk ls *)",
  "Bash(sort *)",
  "Bash(uvx basic-memory *)",
  "Bash(~/projects/youtrack_api/get-issue.sh *)",
  "Bash(~/projects/youtrack_api/list-unresolved-issues.sh *)",
  "Bash(~/projects/youtrack_api/add-comment.sh *)",
  # Read is wider than write on purpose: the write scope is this project only,
  # and the deny list below carves the exceptions out of it.
  "Read(./**)",
  "Read(~/.basic-memory/**)",
  "Read(~/.claude/**)",
  "Read(~/.config/**)",
  "Read(~/projects/dot_files/wsl/.claude/**)",
  "Read(~/projects/flowers/featherhill/**)",
  "Write(./**)",
  "Edit(./**)",
]

# `uv run` is the sanctioned way to run anything Python here, and it is the
# single largest source of no-match fallback traffic. Naming it makes that
# traffic a rule match rather than a fallback: it keeps the interactive prompt,
# drops the warning noise under auto, and stops the auto-mode trace recording it
# as "no_match" -- a cause that means "addressable by writing a rule".
#
# Foreign inline code (`python -c`, a heredoc into python/node/perl/...) is
# ASK-floored regardless, and no allow rule lifts it -- verified 2026-09-07 that
# neither `Bash(*)` nor the `__HEREDOC_TO_python__` sentinel changes the outcome.
# What governs it is undecidable_fallback, which is why it is set above rather
# than left to default. Only FOREIGN executors are floored; a heredoc into
# bash/sh is not. The durable advice is unchanged: write the script to a file
# and run it rather than inlining Python into bash.
ask = [
  { match = "Bash(uv run *)", auto_mode_behavior = "allow" },
]

# These denies are the only thing standing between an unattended run and these
# paths. An unmatched write here does not fail closed: under auto mode the
# inherited no_match_fallback_in_auto_mode permits it. So each entry has to be
# an explicit deny, not merely an absent allow.
#
# They close the FILE-TOOL half only. Bash-side writes to the same paths (`>`,
# `tee`, `rm`, `mv`) cannot be enumerated exhaustively, and are caught after the
# fact by architecture_fitness.py --guard, which inspects what was actually
# touched rather than predicting every spelling.
#
# Self-locking on purpose: with toolguard_hook.toml itself denied, an agent
# cannot remove these either, and a deny is overridable only at a MORE specific
# level. Editing them is Arnon's action, via the IDE.
#
# Within the file rules: ./logs is evidence, written by toolguard and read by
# agents; .env and .claude.env are secrets; the rest is permission configuration
# at both project and user level.
deny = [
  { match="Bash(python *)", additionalContext="python must be executed using uv" },   # Always run python through uv, in the current venv
  { match="Bash(python3 *)", additionalContext="python must be executed using uv" },
  "Write(./.claude.env)",
  "Write(./.claude/settings.json)",
  "Write(./.claude/settings.local.json)",
  "Write(./.claude/toolguard_hook.toml)",
  "Write(./.env)",
  "Write(./logs/**)",
  "Write(~/.claude/settings.json)",
  "Write(~/.claude/settings.local.json)",
  "Write(~/.claude/toolguard_hook.toml)",
  "Write(~/.toolguard/rules/**)",
  "Edit(./.claude.env)",
  "Edit(./.claude/settings.json)",
  "Edit(./.claude/settings.local.json)",
  "Edit(./.claude/toolguard_hook.toml)",
  "Edit(./.env)",
  "Edit(./logs/**)",
  "Edit(~/.claude/settings.json)",
  "Edit(~/.claude/settings.local.json)",
  "Edit(~/.claude/toolguard_hook.toml)",
  "Edit(~/.toolguard/rules/**)",
]
